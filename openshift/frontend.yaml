apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-ui
  labels:
    app: security-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-ui
  template:
    metadata:
      labels:
        app: security-ui
    spec:
      containers:
        - name: frontend
          image: security-ui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: security-ui
spec:
  selector:
    app: security-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: security-ui
spec:
  to:
    kind: Service
    name: security-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

