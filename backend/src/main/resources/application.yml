spring:
  application:
    name: security-api

  profiles:
    default: dev

  datasource:
    url: jdbc:h2:file:./data/securitydb;AUTO_SERVER=TRUE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: false

server:
  # Use SERVER_PORT instead of the generic PORT variable.
  # OpenShift deployment explicitly sets SERVER_PORT=8080.
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # Development-only default value.
    # OpenShift overrides this with the JWT_SECRET secret.
    secret: ${JWT_SECRET:c3ByaW5nLXJlYWN0LXNlY3VyaXR5LWRldi1rZXktMzItYnl0ZXMhIQ==}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}